# Tag "v<version>" (must match pyproject.toml) → public check, tests → .mcpb, wheel and sdist on the GitHub release.
# PyPI: repository variable PYPI_PUBLISH=testpypi or pypi, trusted publishing (no token), see docs/RELEASE.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Version check
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu pyproject.toml ($V)"; exit 1; fi
      - name: Prüfskript (Pflicht)
        run: uv run --frozen python tools/check_public.py --all
      - name: Plugin passt zur Version
        run: |
          uv run --frozen python tools/build_plugin.py
          git diff --exit-code plugin/ || { echo "plugin/ ist nicht aktuell: tools/build_plugin.py laufen lassen"; exit 1; }
      - name: ffmpeg für die Tests (das Bundle bringt sein eigenes mit)
        run: brew install ffmpeg
      - name: Tests (ohne Resolve, ohne Gladia-Key; Chromium-Tests werden übersprungen)
        run: uv run --frozen pytest -q
      - name: Bundle bauen
        run: uv run --frozen python packaging/build_mcpb.py
      - name: Python-Paket bauen
        run: uv build
      - name: Paket startet über uvx
        run: |
          uv run --frozen python tools/smoke_uvx.py "dist/schnippo-${VERSION}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Release mit .mcpb und Python-Paket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          t = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}.*?(?=^## |\Z)", t, re.S | re.M)
          print(m.group(0) if m else f"Version {v}")
          PY
          )
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v${VERSION}"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Schnippo $VERSION" --notes "$NOTES"
          gh release upload "$TAG" "dist/schnippo-${VERSION}.mcpb" "dist/schnippo-${VERSION}-py3-none-any.whl" "dist/schnippo-${VERSION}.tar.gz" --clobber

  pypi:
    needs: bundle
    if: vars.PYPI_PUBLISH == 'testpypi' || vars.PYPI_PUBLISH == 'pypi'
    runs-on: ubuntu-latest
    environment: ${{ vars.PYPI_PUBLISH }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ vars.PYPI_PUBLISH == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
