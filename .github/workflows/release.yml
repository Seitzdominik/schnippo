# Builds the .mcpb bundle and attaches it to a GitHub release (the repository is private, so is the release).
# Trigger: push a tag "v<version>" that matches pyproject.toml, e.g.  git tag v0.8.0 && git push origin v0.8.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Version check
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu pyproject.toml ($V)"; exit 1; fi
      - name: ffmpeg für die Tests (das Bundle bringt sein eigenes mit)
        run: brew install ffmpeg
      - name: Tests (ohne Resolve, ohne Gladia-Key; Chromium-Tests werden übersprungen)
        run: uv run --frozen pytest -q
      - name: Bundle bauen
        run: uv run --frozen python packaging/build_mcpb.py
      - name: Release mit .mcpb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          t = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}.*?(?=^## |\Z)", t, re.S | re.M)
          print(m.group(0) if m else f"Version {v}")
          PY
          )
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v${VERSION}"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Schnippo $VERSION" --notes "$NOTES"
          gh release upload "$TAG" "dist/schnippo-${VERSION}.mcpb" --clobber
